<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin calculator 2</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
    </header>
    <div class="container">
      <div id="screen">0</div>
      <div id="1" class="btn number">1</div>
      <div id="2" class="btn number">2</div>
      <div id="3" class="btn number">3</div>
      <div id="+" class="btn accent">+</div>
      <div id="4" class="btn number">4</div>
      <div id="5" class="btn number">5</div>
      <div id="6" class="btn number">6</div>
      <div id="-" class="btn accent">-</div>
      <div id="7" class="btn number">7</div>
      <div id="8" class="btn number">8</div>
      <div id="9" class="btn number">9</div>
      <div id="*" class="btn accent">*</div>
      <div id="clear" class="btn">clear</div>
      <div id="0" class="btn number">0</div>
      <div id="equals" class="btn accent">=</div>
      <div id="/" class="btn accent">/</div>
    </div>
  </body>
</html>
